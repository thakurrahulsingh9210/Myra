[build-system]
requires=["setuptools>=69"]
build-backend="setuptools.build_meta"
[project]
name="myra-pc"
version="0.4.0"
description="Myra AI Windows desktop assistant"
requires-python=">=3.11"
[project.optional-dependencies]
desktop=["PySide6>=6.8,<7","pyautogui>=0.9.54,<1","pywinauto>=0.6.9,<1"]
audio=["sounddevice>=0.5,<1","numpy>=1.26,<3"]
offline=["pyttsx3>=2.98,<3","faster-whisper>=1.1,<2"]
online=["openai>=1.68,<3","google-genai>=1.0,<2"]
all=["PySide6>=6.8,<7","pyautogui>=0.9.54,<1","pywinauto>=0.6.9,<1","sounddevice>=0.5,<1","numpy>=1.26,<3","pyttsx3>=2.98,<3","faster-whisper>=1.1,<2","openai>=1.68,<3","google-genai>=1.0,<2"]
test=["pytest>=8,<9"]
[tool.setuptools.packages.find]
where=["."]
include=["myra_pc*"]
[tool.pytest.ini_options]
pythonpath=["."]
testpaths=["tests"]
